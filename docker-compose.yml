services:
  mysql:
    image: mysql:8.0
    container_name: kezzler-test-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kezzler
    ports:
      - "3306:3306"
    volumes:
      # anything in this folder runs automatically on first start, in filename order
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./02_readonly_user.sql:/docker-entrypoint-initdb.d/02_readonly_user.sql
    command: --default-authentication-plugin=mysql_native_password
